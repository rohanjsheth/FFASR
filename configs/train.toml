[model]
model_id = "Qwen/Qwen3-ASR-1.7B-hf"
# Weight storage dtype, independent of the bf16/fp16 autocast flags below. Keep
# this at float32 so the optimizer updates full-precision master weights; loading
# straight into bfloat16 makes updates at this learning rate round away.
load_dtype = "float32"

[datasets]
# LibriTTS transcripts are naturally cased and punctuated, matching what the
# frozen decoder already emits. LibriSpeech's ALL CAPS tokenises ~1.7x longer and
# strands the decoder in a token space its language prior barely covers.
# Load the split's parquet shards directly. The "clean" config pulls every clean
# split (train.clean.360 included) — 250 hours downloaded to use 54.
speech_train_parquet = "hf://datasets/mythicinfinity/libritts/data/train.clean.100/*.parquet"
speech_validation_parquet = "hf://datasets/mythicinfinity/libritts/data/dev.clean/*.parquet"
text_column = "text_normalized"
# Reverb tails run to ~1s, and noise offsets are drawn up to 3000 ms, so clips
# shorter than this never express the far-field effect being trained for.
min_duration_seconds = 2.0
noise_id = "bilguun/musan-noise"
noise_split = "train"
rir_parquet = "https://huggingface.co/datasets/treble-technologies/Treble10-RIR/resolve/main/data/rir_mono-00000-of-00001.parquet"

[paths]
cache_dir = ".hf_cache"
output_root = "outputs"

[scene]
sample_rate = 16000
language = "English"
base_seed = 42
number_of_noises = 2
clean_probability = 0.25

[validation]
# A fixed subset keeps checkpoint evaluation useful without dominating training.
num_examples = 256
seed = 43
# Every validation scene must pass through a held-out room, otherwise part of the
# fold metric measures nothing about room generalization.
clean_probability = 0.0
# Per-band WER alongside eval_loss at every eval step. Generation is the cost
# here: 256 scenes adds roughly a minute per eval.
wer_examples = 256
wer_batch_size = 8
wer_max_new_tokens = 256

[training]
# Effective batch size on one GPU is batch size × accumulation steps.
per_device_train_batch_size = 8
per_device_eval_batch_size = 8
gradient_accumulation_steps = 4
# Scene rendering is CPU-bound, so this tracks the pod's vCPU count (32 on an L40).
dataloader_num_workers = 16

learning_rate = 2e-6
lr_scheduler_type = "cosine"
# Transformers 5 accepts a fraction below 1 here as a ratio of total steps.
warmup_steps = 0.03
weight_decay = 0.01
max_grad_norm = 1.0
num_train_epochs = 1.0
bf16 = true
fp16 = false
gradient_checkpointing = true

eval_strategy = "steps"
# These two must stay equal. load_best_model_at_end tracks the best metric across
# every eval, but can only load a step that was also saved -- if the best lands on
# an unsaved step it sets best_model_checkpoint to None, silently keeps the final
# state, and logs no warning.
eval_steps = 50
save_strategy = "steps"
save_steps = 50
save_total_limit = 3
load_best_model_at_end = true
# Selecting on loss picked the worst checkpoints for a whole campaign, because
# loss and low-band WER move in opposite directions. BandWERCallback publishes
# eval_wer_low into the metrics dict, so select on the thing we care about.
metric_for_best_model = "eval_wer_low"
greater_is_better = false
logging_steps = 10
remove_unused_columns = false
report_to = "none"
