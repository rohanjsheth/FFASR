# Rationale for these settings: docs/train-config.md

[model]
model_id = "Qwen/Qwen3-ASR-1.7B-hf"
load_dtype = "float32"

[datasets]
speech_train_parquet = "/root/data/speech_mix.parquet"
speech_validation_parquet = "/root/data/speech_dev.parquet"
text_column = "text_normalized"
min_duration_seconds = 2.0
max_transcript_chars = 1000
noise_id = "bilguun/musan-noise"
noise_split = "train"
rir_parquet = "https://huggingface.co/datasets/treble-technologies/Treble10-RIR/resolve/main/data/rir_mono-00000-of-00001.parquet"
train_rir_parquet = "hf://datasets/rohansheth/AcousticRooms/acoustic_rooms_r20.parquet"

[paths]
cache_dir = ".hf_cache"
output_root = "outputs"

[scene]
sample_rate = 16000
language = "English"
base_seed = 42
number_of_noises = 2
clean_probability = 0.25

[validation]
num_examples = 768
seed = 43
clean_probability = 0.0
wer_examples = 768
wer_batch_size = 16
wer_max_new_tokens = 256

[objective]
distill = true
temperature = 1.0
ce_weight = 0.0
mask_punctuation = true

[training]
per_device_train_batch_size = 16
per_device_eval_batch_size = 16
gradient_accumulation_steps = 2
dataloader_num_workers = 24

learning_rate = 2e-6
lr_scheduler_type = "cosine"
warmup_steps = 0.03
weight_decay = 0.01
max_grad_norm = 1.0
num_train_epochs = 1.0
bf16 = true
fp16 = false
gradient_checkpointing = true

eval_strategy = "steps"
eval_steps = 300
save_strategy = "steps"
save_steps = 300
save_total_limit = 3
load_best_model_at_end = false
logging_steps = 10
remove_unused_columns = false
report_to = "none"
