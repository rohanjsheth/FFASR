[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ffasr"
version = "0.1.0"
description = "Synthetic far-field ASR scene generation and data preparation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.12,<2",
    "datasets>=5.0,<6",
    "matplotlib>=3.10,<4",
    "numpy>=2.0,<3",
    "pandas>=2.0,<3",
    "scipy>=1.15,<2",
    "soundfile>=0.13,<1",
    "torch>=2.6,<3",
    # datasets>=5 encodes audio through torchcodec on any non-streaming load, so
    # this is required even though nothing here imports it. Its build is tied to
    # torch: 0.7.x pairs with torch 2.8. Bumping torch means bumping this, and
    # pip's default wheel targets the newest CUDA, which will not load against an
    # older one. Needs FFmpeg shared libraries present, which pip cannot install.
    "torchcodec>=0.7,<0.8",
    "transformers>=5.15,<6",
]

[project.scripts]
ffasr-evaluate-snr = "scripts.evaluate_snr_wer:main"
ffasr-inspect-rir-folds = "scripts.inspect_rir_folds:main"
ffasr-render-samples = "scripts.render_samples:main"
ffasr-smoke-test = "scripts.smoke_test_dataloader:main"

[tool.setuptools.packages.find]
include = ["audio_utils*", "data_utils*", "eval_utils*", "scripts*", "training_utils*"]
